<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="radarGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Grid Matrix Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer chamfer square / viewport -->
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#071326" stroke="url(#gridGrad)" stroke-width="1.8" />
    <!-- Grid lines -->
    <line x1="2" y1="17" x2="46" y2="17" stroke="#00F0FF" stroke-opacity="0.25" stroke-dasharray="2 2" />
    <line x1="2" y1="31" x2="46" y2="31" stroke="#00F0FF" stroke-opacity="0.25" stroke-dasharray="2 2" />
    <line x1="17" y1="2" x2="17" y2="46" stroke="#00F0FF" stroke-opacity="0.25" stroke-dasharray="2 2" />
    <line x1="31" y1="2" x2="31" y2="46" stroke="#00F0FF" stroke-opacity="0.25" stroke-dasharray="2 2" />
    <!-- Radar / Navigation Polygon -->
    <polygon points="24,10 38,36 24,30 10,36" fill="url(#radarGlow)" stroke="#00F0FF" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="24" cy="22" r="2.5" fill="#FFFFFF" />
    <circle cx="24" cy="22" r="5" stroke="#10B981" stroke-width="1" stroke-opacity="0.8" />
  </g>
  <!-- Text Wordmark -->
  <text x="64" y="32" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">GEO<tspan fill="#00F0FF">GRID</tspan></text>
  <text x="65" y="46" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#10B981" letter-spacing="3.2">CAMPUS // NAV</text>
</svg>
