<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="radarGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Grid Matrix Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer chamfer square / viewport -->
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#0F172A" stroke="url(#gridGrad)" stroke-width="1.8" />
    <!-- Grid lines -->
    <line x1="2" y1="17" x2="46" y2="17" stroke="#38BDF8" stroke-opacity="0.3" stroke-dasharray="2 2" />
    <line x1="2" y1="31" x2="46" y2="31" stroke="#38BDF8" stroke-opacity="0.3" stroke-dasharray="2 2" />
    <line x1="17" y1="2" x2="17" y2="46" stroke="#38BDF8" stroke-opacity="0.3" stroke-dasharray="2 2" />
    <line x1="31" y1="2" x2="31" y2="46" stroke="#38BDF8" stroke-opacity="0.3" stroke-dasharray="2 2" />
    <!-- Radar / Navigation Polygon -->
    <polygon points="24,10 38,36 24,30 10,36" fill="url(#radarGlow)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="24" cy="22" r="2.5" fill="#FFFFFF" />
    <circle cx="24" cy="22" r="5" stroke="#10B981" stroke-width="1" stroke-opacity="0.8" />
  </g>
  <!-- Text Wordmark -->
  <text x="64" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="1.2">GEO<tspan fill="#0284C7">GRID</tspan></text>
  <text x="65" y="46" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#059669" letter-spacing="2.8">CAMPUS NAV</text>
</svg>
